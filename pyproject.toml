[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schemaxl"
version = "0.1.0.dev0"
description = "Pydantic モデルを単一の真実として Excel 帳票を宣言的に生成するライブラリ"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wada Yusuke" }]
keywords = ["excel", "xlsx", "pydantic", "report", "openpyxl", "layout"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business",
]
dependencies = [
    "pydantic>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# lint / 型検査ツールはマイナーまで固定する。新しいルールが入るたびにコード変更なしで
# CI が落ちるのを防ぐため(ruff 0.16 の RUF022 で実際に起きた)。更新は Dependabot の
# PR で行い、その PR 上で CI を通してから取り込む。
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.*",
    "mypy==2.3.*",
]

[project.urls]
Homepage = "https://github.com/wadayuusuke/schemaxl"
Repository = "https://github.com/wadayuusuke/schemaxl"

# src レイアウトを採用。配布パッケージは src/schemaxl 配下。
[tool.hatch.build.targets.wheel]
packages = ["src/schemaxl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# カバレッジ。層ごとの閾値(純粋関数の core は 95%、副作用境界の backends は 85%)は
# CI で `coverage report --include=... --fail-under=...` として課す。ここは全体の下限。
[tool.coverage.run]
source = ["schemaxl"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
# ruff 0.16 から Markdown 内のコードブロックも整形対象に入った。README の
# 「API スケッチ」はコメントの桁を揃えて「データ制約」と「レイアウト制約」の
# 対比を見せる意図的な整形であり(CLAUDE.md が設計意図の一次情報と位置づけている)、
# 実行されるコードでもない。ドキュメントはコードフォーマッタの対象から外す。
extend-exclude = ["*.md"]

[tool.mypy]
packages = ["schemaxl"]
strict = true

# openpyxl は型スタブを同梱しない。backend 層のみで使うため、この依存に限って
# missing imports を無視する(他は strict のまま)。
[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true
