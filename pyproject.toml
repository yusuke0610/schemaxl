[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schemaxl"
version = "0.1.0.dev0"
description = "Pydantic モデルを単一の真実として Excel 帳票を宣言的に生成するライブラリ"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wada Yusuke" }]
keywords = ["excel", "xlsx", "pydantic", "report", "openpyxl", "layout"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business",
]
dependencies = [
    "pydantic>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/wadayuusuke/schemaxl"
Repository = "https://github.com/wadayuusuke/schemaxl"

# src レイアウトを採用。配布パッケージは src/schemaxl 配下。
[tool.hatch.build.targets.wheel]
packages = ["src/schemaxl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
# ruff 0.16 から Markdown 内のコードブロックも整形対象に入った。README の
# 「API スケッチ」はコメントの桁を揃えて「データ制約」と「レイアウト制約」の
# 対比を見せる意図的な整形であり(CLAUDE.md が設計意図の一次情報と位置づけている)、
# 実行されるコードでもない。ドキュメントはコードフォーマッタの対象から外す。
extend-exclude = ["*.md"]

[tool.mypy]
packages = ["schemaxl"]
strict = true

# openpyxl は型スタブを同梱しない。backend 層のみで使うため、この依存に限って
# missing imports を無視する(他は strict のまま)。
[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true
