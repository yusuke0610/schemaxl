name: 不具合報告
description: 期待どおりに動かない・見切れる・例外になる
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 現象
      description: 何が起きたか。出力 xlsx のどこがどう崩れたか。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 再現コード
      description: 行モデル(`Layout` を含む)・`Report` 定義・入力行の最小例。
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する挙動
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: バージョン
      description: "`python -c 'import schemaxl; print(schemaxl.__version__)'` と Python のバージョン"
    validations:
      required: true
